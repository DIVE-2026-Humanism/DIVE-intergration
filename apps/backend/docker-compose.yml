# ============================================================
# 팀 공용 개발용 PostgreSQL + Redis (LAN 공유용)
# 실행: docker compose up -d
# 종료: docker compose down          (볼륨 유지, 데이터 보존)
#       docker compose down -v       (볼륨까지 삭제, 데이터 초기화)
#
# [LAN 공유 안내]
# - 이 파일을 띄우는 PC가 "서버 역할"을 합니다. 팀원은 이 PC의 LAN IP로 접속합니다.
# - 호스트 LAN IP 확인: Windows `ipconfig` / macOS,Linux `ifconfig` 또는 `ip addr`
#   예) 192.168.0.15 라면 팀원은 jdbc:postgresql://192.168.0.15:5432/... 로 접속
# - 호스트 PC의 OS 방화벽에서 5432(Postgres), 6379(Redis) 인바운드를 허용해야 합니다.
#   Windows: 제어판 > Windows Defender 방화벽 > 고급 설정 > 인바운드 규칙 > 포트 5432, 6379 허용
#   macOS: 시스템 설정 > 개인정보 보호 및 보안 > 방화벽에서 허용 (보통 Docker는 자동 허용됨)
# - 공유기 포트포워딩은 하지 마세요. 포트포워딩을 하면 인터넷 전체에 DB가 노출됩니다.
#   같은 LAN 안에서만 접속 가능하도록 두는 것이 안전합니다.
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: busanyouth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-busanyouth}
      POSTGRES_USER: ${POSTGRES_USER:-busanyouth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
      TZ: Asia/Seoul
    # 인터넷 전체가 아닌 LAN 대역만 접속 허용하도록 커스텀 pg_hba.conf 사용
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-busanyouth} -d ${POSTGRES_DB:-busanyouth}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - busanyouth-net

  redis:
    image: redis:7-alpine
    container_name: busanyouth-redis
    restart: unless-stopped
    # requirepass로 비밀번호 설정 (운영/로컬 공용 습관을 들이는 걸 권장)
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?.env에 REDIS_PASSWORD를 설정하세요}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - busanyouth-net

volumes:
  postgres_data:
    name: busanyouth-postgres-data
  redis_data:
    name: busanyouth-redis-data

networks:
  busanyouth-net:
    driver: bridge