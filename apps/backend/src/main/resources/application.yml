spring:
  # `docker compose`와 로컬 실행이 같은 .env 값을 사용하도록 한다.
  # 파일이 없는 배포 환경에서는 OS 환경변수와 아래 기본값으로 계속 동작한다.
  config:
    import: optional:file:.env[.properties]

  application:
    name: dive-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/busanyouth}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update} # 로컬 테스트 편의용. 운영에서는 Flyway 등으로 전환 권장
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads/gonggu}
  base-url: ${FILE_BASE_URL:/images}

dive:
  ai:
    base-url: ${DIVE_AI_BASE_URL:https://ai.beceleb.org}
    connect-timeout-ms: ${DIVE_AI_CONNECT_TIMEOUT_MS:3000}   # 연결 3초
    read-timeout-ms: ${DIVE_AI_READ_TIMEOUT_MS:30000}        # 응답 30초
    max-retries: ${DIVE_AI_MAX_RETRIES:1}

recommendation:
  candidate-limit: ${RECO_CANDIDATE_LIMIT:30}
  result-count: ${RECO_RESULT_COUNT:5}
  stable-policy-type-id: ${RECO_STABLE_POLICY_TYPE_ID:1}
  vulnerable-policy-type-id: ${RECO_VULNERABLE_POLICY_TYPE_ID:2}

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-env-var}
  access-token-validity-in-milliseconds: ${JWT_AT_VALIDITY:43200000}      # 12시간
  refresh-token-validity-in-milliseconds: ${JWT_RT_VALIDITY:604800000}  # 7일

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}

kakaopay:
  cid: ${KAKAO_PAY_CID:TC0ONETIME} # 테스트용 고정 가맹점 코드. 실서비스 승인 후 발급받은 cid로 교체
  secret-key: ${KAKAO_PAY_SECRET_KEY:}
  approval-url: ${KAKAO_PAY_APPROVAL_URL:http://localhost:8080/api/v1/gonggu/payment/approve}
  cancel-url: ${KAKAO_PAY_CANCEL_URL:http://localhost:8080/api/v1/gonggu/payment/cancel}
  fail-url: ${KAKAO_PAY_FAIL_URL:http://localhost:8080/api/v1/gonggu/payment/fail}

youthcenter:
  api-key: ${YOUTH_CENTER_KEY:}

server:
  port: ${SERVER_PORT:8082}
