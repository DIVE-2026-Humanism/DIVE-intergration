spring:
  application:
    name: dive-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/busanyouth}
    username: ${POSTGRES_USER:busanyouth}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update} # 로컬 테스트 편의용. 운영에서는 Flyway 등으로 전환 권장
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads/gonggu}
  base-url: ${FILE_BASE_URL:/images}

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-env-var}
  access-token-validity-in-milliseconds: ${JWT_AT_VALIDITY:3600000}      # 1시간
  refresh-token-validity-in-milliseconds: ${JWT_RT_VALIDITY:604800000}  # 7일

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}

kakaopay:
  cid: ${KAKAO_PAY_CID:TC0ONETIME} # 테스트용 고정 가맹점 코드. 실서비스 승인 후 발급받은 cid로 교체
  secret-key: ${KAKAO_PAY_SECRET_KEY:}
  approval-url: ${KAKAO_PAY_APPROVAL_URL:http://localhost:8080/api/v1/gonggu/payment/approve}
  cancel-url: ${KAKAO_PAY_CANCEL_URL:http://localhost:8080/api/v1/gonggu/payment/cancel}
  fail-url: ${KAKAO_PAY_FAIL_URL:http://localhost:8080/api/v1/gonggu/payment/fail}

youthcenter:
  api-key: ${YOUTH_CENTER_KEY:}

server:
  port: ${SERVER_PORT:8080}
