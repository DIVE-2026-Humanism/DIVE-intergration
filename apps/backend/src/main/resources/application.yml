spring:
  application:
    name: dive-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/busanyouth}
    username: ${POSTGRES_USER:busanyouth}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update} # 로컬 테스트 편의용. 운영에서는 Flyway 등으로 전환 권장
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-env-var}
  access-token-validity-in-milliseconds: ${JWT_AT_VALIDITY:3600000}      # 1시간
  refresh-token-validity-in-milliseconds: ${JWT_RT_VALIDITY:604800000}  # 7일

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}

youthcenter:
  api-key: ${YOUTH_CENTER_KEY:}

server:
  port: ${SERVER_PORT:8080}
