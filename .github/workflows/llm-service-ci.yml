name: LLM service CI

on:
  push:
    paths:
      - "LLM service/**"
      - ".github/workflows/llm-service-ci.yml"
  pull_request:
    paths:
      - "LLM service/**"
      - ".github/workflows/llm-service-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "LLM service"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: dive_test
          POSTGRES_USER: dive
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dive -d dive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DIVE_TEST_DATABASE_URL: postgresql://dive:1234@127.0.0.1:5432/dive_test
      DIVE_AUTO_INGEST: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "LLM service/requirements.lock"
      - run: pip install -r requirements.lock
      - run: python -m pyflakes src tests scripts
      - run: pytest -q
      - run: docker build -t dive-typepredict:ci .
